[package]
name = "marcan-geo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
futures = "0.3.34"
hickory-resolver = "0.26.3"
idna = "1.1.0"
psl = "2.1.245"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
ureq = "3.5.0"
